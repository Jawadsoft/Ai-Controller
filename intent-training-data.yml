- synonym: available
  examples: |
    - in stock
    - ready
    - on hand
    - obtainable

# =============================================================================
# REGEX FEATURES - For extracting specific information
# =============================================================================
regex:
- regex: price
  examples: |
    - \$\d{1,3}(?:,\d{3})*(?:\.\d{2})?
    - \d{1,3}(?:,\d{3})* dollars?
    - under \$?\d{1,3}(?:,\d{3})*
    - around \$?\d{1,3}(?:,\d{3})*

- regex: year
  examples: |
    - 20\d{2}
    - \d{4}

- regex: mileage
  examples: |
    - \d{1,3}(?:,\d{3})* miles?
    - \d{1,3}(?:,\d{3})* km

# =============================================================================
# RESPONSES - Suggested responses for each intent
# =============================================================================
responses:
  utter_buy_car:
    - text: "Great! I'd be happy to help you find the perfect vehicle. What type of car are you looking for—sedan, SUV, or something else?"
    - text: "Excellent! Let me help you find the right car. Do you have a budget in mind?"
    - text: "Perfect! I'm here to guide you through the car buying process. What's most important to you—budget, vehicle type, or specific features?"

  utter_car_type_preference:
    - text: "Great choice! Do you have a budget range in mind for your {car_type}?"
    - text: "Excellent selection! What features are most important to you in a {car_type}?"
    - text: "Perfect! I can help you find the best {car_type} options. Do you have any specific requirements?"

  utter_budget_inquiry:
    - text: "Noted! With a budget of {budget}, I can show you some great options. What type of vehicle are you thinking?"
    - text: "Perfect! That budget gives us excellent choices. Are you looking for a specific vehicle type?"
    - text: "Great! I can definitely work within that budget. What features are most important to you?"

  utter_financing_options:
    - text: "Excellent question! We have several financing options available. Are you looking to lease or purchase?"
    - text: "Great question about financing! What's your preferred monthly payment range?"
    - text: "Perfect! I can help you with financing. Do you have a trade-in or are you starting fresh?"

  utter_feature_request:
    - text: "Great question! I can show you vehicles with {feature}. Do you have a budget range in mind?"
    - text: "Excellent! I have several options with {feature}. What type of vehicle are you looking for?"
    - text: "Perfect! Let me show you vehicles with {feature}. Do you have any other specific requirements?"

  utter_car_comparison:
    - text: "Great question! I'd be happy to compare those options for you. What's most important in your comparison?"
    - text: "Excellent! I can provide a detailed comparison. What aspects are you most interested in?"
    - text: "Perfect! Let me compare those options. Do you have a budget range to help narrow down the best choice?"

  utter_check_availability:
    - text: "Great question! Let me check the current availability for you. When would you like to test drive?"
    - text: "Excellent! I can check stock and availability. What's your preferred timeline?"
    - text: "Perfect! Let me verify availability and schedule a test drive. When would be convenient for you?"

  utter_ask_discounts:
    - text: "Great question about deals! We have several current promotions. What type of vehicle are you interested in?"
    - text: "Excellent! I can show you our current offers and discounts. Do you have a specific model in mind?"
    - text: "Perfect! Let me show you our best deals. What's your budget range to help find the best offers?"

  utter_after_sales:
    - text: "Great question about service! I can explain our warranty and service options. What specific information do you need?"
    - text: "Excellent! Let me cover our after-sales support. Are you asking about warranty, service, or both?"
    - text: "Perfect! I can help with all your after-sales questions. What's most important to you?"

  utter_purchase_commitment:
    - text: "Excellent! I'm excited to help you complete your purchase. Do you prefer financing or paying cash?"
    - text: "Perfect! Let's get you into your new car. What's your preferred method of payment?"
    - text: "Great! I'm ready to help you finalize everything. Do you have all the necessary documents ready?"

# =============================================================================
# STORIES - Sample conversation flows
# =============================================================================
stories:
- story: car purchase journey
  steps:
  - intent: buy_car
  - action: utter_buy_car
  - intent: car_type_preference
  - action: utter_car_type_preference
  - intent: budget_inquiry
  - action: utter_budget_inquiry
  - intent: feature_request
  - action: utter_feature_request
  - intent: check_availability
  - action: utter_check_availability
  - intent: purchase_commitment
  - action: utter_purchase_commitment

- story: financing inquiry
  steps:
  - intent: financing_options
  - action: utter_financing_options
  - intent: budget_inquiry
  - action: utter_budget_inquiry
  - intent: purchase_commitment
  - action: utter_purchase_commitment

- story: feature comparison
  steps:
  - intent: car_comparison
  - action: utter_car_comparison
  - intent: feature_request
  - action: utter_feature_request
  - intent: check_availability
  - action: utter_check_availability

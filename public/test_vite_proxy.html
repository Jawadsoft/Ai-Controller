<!DOCTYPE html>
<html>
<head>
    <title>Vite Proxy Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .test { margin: 10px 0; padding: 15px; background: white; border-radius: 5px; border-left: 4px solid #ccc; }
        .success { border-left-color: #4caf50; }
        .error { border-left-color: #f44336; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f0f0f0; padding: 10px; overflow-x: auto; }
        .highlight { background: yellow; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔍 Vite Proxy Diagnostic Test</h1>
    <p>This tests if Vite is correctly proxying API requests to Express backend.</p>
    
    <div style="background: #fff3cd; padding: 15px; border-radius: 5px; margin: 20px 0;">
        <strong>⚠️ IMPORTANT:</strong> You must be logged in first!
        <br>Your auth token: <code id="token-display">Checking...</code>
    </div>
    
    <div>
        <button onclick="testViteProxy()">🧪 Test Via Vite Proxy (port 8080)</button>
        <button onclick="testDirectBackend()">🔌 Test Direct Backend (port 3000)</button>
        <button onclick="testBoth()">⚡ Test Both & Compare</button>
    </div>
    
    <div id="results"></div>
    
    <script>
        const authToken = localStorage.getItem('auth_token');
        document.getElementById('token-display').textContent = authToken ? '✅ Found' : '❌ Not found - Please log in!';
        
        function log(html, cssClass = '') {
            const div = document.createElement('div');
            div.className = `test ${cssClass}`;
            div.innerHTML = html;
            document.getElementById('results').prepend(div);
        }
        
        async function testViteProxy() {
            log('🧪 Testing via Vite Proxy (http://localhost:8080/api/...)');
            
            try {
                const url = '/api/finance/deals/00000000-0000-0000-0000-000000000000/generate-sheet';
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                const status = response.status;
                const contentType = response.headers.get('content-type');
                
                let body;
                if (contentType && contentType.includes('application/json')) {
                    body = await response.json();
                } else {
                    body = await response.text();
                }
                
                if (status === 404) {
                    if (typeof body === 'string' && body.includes('<!DOCTYPE')) {
                        log(`
                            <strong>❌ PROBLEM FOUND: Getting HTML 404 from Vite!</strong><br>
                            Status: ${status}<br>
                            Content-Type: ${contentType}<br>
                            <div class="highlight">This means Vite proxy is NOT working!</div>
                            <br>Response (first 300 chars):<br>
                            <pre>${body.substring(0, 300)}...</pre>
                            <strong>Fix: Vite proxy configuration issue</strong>
                        `, 'error');
                    } else {
                        log(`
                            <strong>⚠️ Got JSON 404 from backend</strong><br>
                            Status: ${status}<br>
                            This means proxy works but deal not found (expected)<br>
                            <pre>${JSON.stringify(body, null, 2)}</pre>
                        `);
                    }
                } else if (status === 401 || status === 403) {
                    log(`
                        <strong>✅ PROXY WORKING!</strong><br>
                        Status: ${status} (Auth error - expected)<br>
                        Content-Type: ${contentType}<br>
                        Response:<br>
                        <pre>${JSON.stringify(body, null, 2)}</pre>
                        <div class="highlight">Vite proxy is forwarding correctly to backend!</div>
                    `, 'success');
                } else {
                    log(`
                        <strong>Got Status: ${status}</strong><br>
                        Content-Type: ${contentType}<br>
                        <pre>${JSON.stringify(body, null, 2).substring(0, 500)}</pre>
                    `);
                }
                
            } catch (error) {
                log(`
                    <strong>❌ Request Failed!</strong><br>
                    Error: ${error.message}<br>
                    This could mean Vite server isn't running on port 8080
                `, 'error');
            }
        }
        
        async function testDirectBackend() {
            log('🔌 Testing Direct Backend (http://localhost:3000/api/...)');
            
            try {
                const url = 'http://localhost:3000/api/finance/deals/00000000-0000-0000-0000-000000000000/generate-sheet';
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                const status = response.status;
                const body = await response.json();
                
                if (status === 401 || status === 403 || status === 404) {
                    log(`
                        <strong>✅ Backend Responding!</strong><br>
                        Status: ${status}<br>
                        Response:<br>
                        <pre>${JSON.stringify(body, null, 2)}</pre>
                    `, 'success');
                } else {
                    log(`
                        <strong>Backend Status: ${status}</strong><br>
                        <pre>${JSON.stringify(body, null, 2)}</pre>
                    `);
                }
                
            } catch (error) {
                log(`
                    <strong>❌ Cannot reach backend!</strong><br>
                    Error: ${error.message}<br>
                    Make sure Express server is running: <code>node src/server.js</code>
                `, 'error');
            }
        }
        
        async function testBoth() {
            log('<h3>🔬 Comprehensive Comparison Test</h3>');
            await testDirectBackend();
            await new Promise(resolve => setTimeout(resolve, 500));
            await testViteProxy();
            
            setTimeout(() => {
                log(`
                    <h3>📊 Diagnosis:</h3>
                    <ul>
                        <li>If backend works (401/403) but Vite gives HTML 404 → <strong>Vite proxy broken</strong></li>
                        <li>If backend works AND Vite gives JSON 401/403 → <strong>✅ Everything working!</strong></li>
                        <li>If both give 404 → Backend routes not registered</li>
                        <li>If backend fails to connect → Backend not running</li>
                    </ul>
                `, 'highlight');
            }, 1000);
        }
        
        // Auto-run test on load
        if (!authToken) {
            log('⚠️ <strong>No auth token found!</strong><br>Please log in to the app first, then refresh this page.', 'error');
        }
    </script>
</body>
</html>
